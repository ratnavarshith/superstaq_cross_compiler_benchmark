[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superstaq-cross-compiler-benchmark"
version = "0.1.0"
description = "Cross-compiler benchmark: SuperstaQ vs Qiskit transpiler on varied circuit families and hardware topologies."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    "numpy",
    "networkx",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
superstaq = ["qiskit-superstaq"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["scxb*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
